<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Bugle</title>
  <meta name="description" content="La veille IA/tech du lundi et du jeudi, en français.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Bugle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved theme before first paint (no flash). Absent = follow the system.
    try { const t = localStorage.getItem("ai-bugle:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/archives" aria-label="AI Bugle — toutes les veilles">
        <span class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h3l7 5V5L6 10H3z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </span>
        <span>AI Bugle</span>
      </a>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <button id="theme" class="theme" type="button" aria-label="Changer de thème">
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div id="app" aria-live="polite"><p class="wrap muted">Chargement…</p></div>
  <footer class="foot"><div class="foot-in"><span>AI Bugle · veille IA/tech du lundi et du jeudi</span><span id="gen"></span></div></footer>
  <a id="sel-search" class="sel-search" hidden target="_blank" rel="noopener">Rechercher sur Google</a>
  <noscript><p class="wrap muted">Ce site a besoin de JavaScript pour afficher les veilles.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
