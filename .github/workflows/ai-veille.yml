# Monday/Thursday AI/tech "veille technique" digest → Discord + the GitHub Pages site.
# Runs scripts/daily/veille.ts, which pulls the latest research + model releases + tools +
# discussion (arXiv, HF Daily Papers/models, OpenRouter, Hacker News, GitHub, lab RSS), dedupes +
# ranks them, has Claude write a structured editor's brief (Claude Code on the Claude subscription),
# writes it to site/veilles/YYYY-MM-DD.json (+ index.json) and posts it to Discord. The JSON is then
# committed and site/ is deployed to GitHub Pages.
#
# PAGES: Settings → Pages → Source = "GitHub Actions" (once). The site URL is
#   https://<owner>.github.io/<repo>/ — the Discord post links to it.
#
# DISCORD TARGET:
#   * VEILLE_DISCORD_WEBHOOK_URL (secret) — an incoming webhook bound to the target channel.
#     Discord: channel settings → Integrations → Webhooks → New Webhook → Copy URL.
#     No bot, token or scope needed. Without it the run fails (VEILLE_REQUIRE_DISCORD defaults to
#     true here); set the repo variable VEILLE_REQUIRE_DISCORD=false to just log the digest instead.
#
# OTHER:
#   * CLAUDE_CODE_OAUTH_TOKEN — enables the editor's brief through Claude Code, counted against the
#     Claude Pro/Max subscription (no API billing). Create it locally with `claude setup-token`.
#     Do NOT also set ANTHROPIC_API_KEY: the script strips it, but it would switch billing to the API.
#   * GITHUB_TOKEN is injected automatically (raises the GitHub search rate limit).
#   * REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET (optional) — a reddit.com/prefs/apps "script" app;
#     needed because Reddit 403s the public JSON from datacenter IPs.
#
# NOTE: a scheduled workflow only runs from the copy of this file on the default branch, so it takes
# effect once merged to main. Test the wiring from the Actions tab via "Run workflow".
# Scheduled workflows auto-disable after 60 days with no repo commits (each veille commit counts).

name: AI veille — Monday & Thursday

on:
  schedule:
    # Mondays and Thursdays at 06:17 UTC (08:17 Paris). Off-the-hour on purpose: GitHub cron
    # queues heavily at :00 and is best-effort.
    - cron: "17 6 * * 1,4"
  workflow_dispatch: {} # manual run to test the Discord wiring

permissions:
  contents: read

concurrency:
  group: daily-ai-veille
  cancel-in-progress: false

jobs:
  digest:
    name: Build & post the digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commits site/veilles/*.json
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Build & post the veille digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VEILLE_MODEL: ${{ vars.VEILLE_MODEL || 'claude-sonnet-5-5' }}
          VEILLE_DISCORD_WEBHOOK_URL: ${{ secrets.VEILLE_DISCORD_WEBHOOK_URL }}
          VEILLE_REQUIRE_DISCORD: ${{ vars.VEILLE_REQUIRE_DISCORD || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          # Project Pages URL, linked from the Discord post.
          export VEILLE_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          bun scripts/daily/veille.ts

      # The JSON is written before the Discord post, so a failed post still keeps the veille.
      # The token is passed only to this step (checkout keeps no credentials while veille.ts runs).
      - name: Commit the veille
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add site/veilles
          if git diff --cached --quiet; then echo "No new veille to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Veille $(date -u +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

  deploy:
    name: Publish the site
    needs: digest
    if: ${{ !cancelled() }} # publish what was committed even when the Discord post failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout (with the veille just committed)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
