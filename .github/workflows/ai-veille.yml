# Monday/Thursday AI/tech "veille technique" digest → Discord.
# Runs scripts/daily/veille.ts, which pulls the latest research + model releases + tools +
# discussion (arXiv, HF Daily Papers/models, OpenRouter, Hacker News, GitHub, lab RSS), dedupes +
# ranks them, has Claude write an editor's brief (Claude Code on the Claude subscription), and
# posts to Discord.
#
# DISCORD TARGET:
#   * VEILLE_DISCORD_WEBHOOK_URL (secret) — an incoming webhook bound to the target channel.
#     Discord: channel settings → Integrations → Webhooks → New Webhook → Copy URL.
#     No bot, token or scope needed. Without it the run fails (VEILLE_REQUIRE_DISCORD defaults to
#     true here); set the repo variable VEILLE_REQUIRE_DISCORD=false to just log the digest instead.
#
# OTHER:
#   * CLAUDE_CODE_OAUTH_TOKEN — enables the editor's brief through Claude Code, counted against the
#     Claude Pro/Max subscription (no API billing). Create it locally with `claude setup-token`.
#     Do NOT also set ANTHROPIC_API_KEY: the script strips it, but it would switch billing to the API.
#   * GITHUB_TOKEN is injected automatically (raises the GitHub search rate limit).
#   * REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET (optional) — a reddit.com/prefs/apps "script" app;
#     needed because Reddit 403s the public JSON from datacenter IPs.
#
# NOTE: a scheduled workflow only runs from the copy of this file on the default branch, so it takes
# effect once merged to main. Test the wiring from the Actions tab via "Run workflow".
# Scheduled workflows auto-disable after 60 days with no repo commits.

name: AI veille — Monday & Thursday

on:
  schedule:
    # Mondays and Thursdays at 06:17 UTC (08:17 Paris). Off-the-hour on purpose: GitHub cron
    # queues heavily at :00 and is best-effort.
    - cron: "17 6 * * 1,4"
  workflow_dispatch: {} # manual run to test the Discord wiring

permissions:
  contents: read

concurrency:
  group: daily-ai-veille
  cancel-in-progress: false

jobs:
  digest:
    name: Build & post the digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Build & post the veille digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VEILLE_MODEL: ${{ vars.VEILLE_MODEL || 'claude-sonnet-5-5' }}
          VEILLE_DISCORD_WEBHOOK_URL: ${{ secrets.VEILLE_DISCORD_WEBHOOK_URL }}
          VEILLE_REQUIRE_DISCORD: ${{ vars.VEILLE_REQUIRE_DISCORD || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: bun scripts/daily/veille.ts
